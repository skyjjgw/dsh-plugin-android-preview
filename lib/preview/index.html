<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Android · 手机预览</title><link rel="stylesheet" href="/style.css"><script type="module" src="/client.js"></script></head>
<body><main>
  <header><i id="indicator"></i><span>Android</span><span id="device">emulator-5556</span><span id="connection" aria-live="polite">正在连接…</span></header>
  <section class="screen"><canvas id="phone" width="488" height="1080" tabindex="0" aria-label="安卓手机画面，支持点击和滑动"></canvas><div id="placeholder">正在连接手机…</div></section>
  <nav aria-label="手机工具栏">
    <div class="group"><button id="restart" title="打开或重启 App" aria-label="打开或重启 App">⏵</button><button id="reload" title="热重载" aria-label="热重载">↯</button></div>
    <div class="group"><button data-key="4" title="返回" aria-label="返回">◁</button><button data-key="3" title="主页" aria-label="主页">●</button><button data-key="187" title="最近任务" aria-label="最近任务">□</button></div>
    <div class="group"><button id="refresh" title="刷新画面" aria-label="刷新画面">↻</button></div>
  </nav>
  <span id="mirror" hidden></span><span id="flutter" hidden></span><span id="reload-count" hidden></span>
  <textarea id="keyboard" tabindex="-1" aria-label="手机键盘输入" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
</main></body></html>
